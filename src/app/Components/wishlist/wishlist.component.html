<section>
    <h2 class="text-center mb-4">Our WishList</h2>
    <div class="my-4" >
        <div class="row  g-3 ">
            @for (wish of WishList.slice(0,20) ; track wish.id) {
            <div class="col-md-2">
                <div class="product p-2">
                    <div>
                        <img class="w-100" [src]="wish.imageCover" [alt]="wish.title">
                        <h3 class="small text-main">{{wish.category.name}}</h3>
                        <h6>{{ wish.title.slice(0, 20) }}{{ wish.title.length > 20 ? '...' : '' }}</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <span>{{wish.price |currency }} </span>
                            <div>
                                <span>
                                    <div class="fas fa-star rating-color"></div>
                                </span>
                                <span class="text-muted">{{wish.ratingsAverage}}</span>
                            </div>
                        </div>
                        <button class="btn-main" (click)="AddToCart(wish.id)">AddToCart</button>
                        <button class="btn btn-outline-danger ms-2" (click)="RemoveToWishlist(wish.id)">
                         <i class="fas fa-heart"></i>Reomve
                        </button>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>


</section>
