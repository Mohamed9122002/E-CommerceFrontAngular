@if( detailsProduct){
    <section class="my-3">
    <h1 class="text-center">{{detailsProduct.title}}</h1>
    <div class="row align-items-center ">
        <div class="col-md-3">
            <div>
                <img [src]="detailsProduct.imageCover" class="w-100" [alt]="detailsProduct.title">
            </div>
        </div>
        <div class="col-md-9">
            <div>
                <h2>{{detailsProduct.title}}</h2>
                <p class="text-muted">{{detailsProduct.description}}</p>
                <h3>{{detailsProduct.category?.name}}</h3>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <span>{{detailsProduct.price}} EGP</span>
                <div>
                    <span>
                        <div class="fas fa-star rating-color"></div>
                    </span>
                    <span class="text-muted">{{detailsProduct.ratingsAverage}}</span>
                </div>
            </div>
            <button class="btn-main w-100">AddToCart</button>
        </div>
    </div>
</section>
}
