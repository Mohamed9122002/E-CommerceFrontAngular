@if(Category){
<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 450px;">
    <img [src]="Category.image" class="card-img-top rounded-top-4 category-img" alt="{{ Category.name }}" />
    <div class="card-body text-center">
      <h3 class="card-title text-primary fw-bold">{{ Category.name }}</h3>

      <p class="text-muted mb-2">
        <i class="fa-solid fa-tag me-2 text-secondary"></i>{{ Category.slug }}
      </p>
    </div>
  </div>
</div>

}
