<section class=" bg-main-light rounded-4 shadow p-4 my-2 w-75 mx-auto">
    <div class="d-flex justify-content-between align-items-center">
            <h1 class="h2 text-center">Shop Cart</h1>
            <button (click)="ClearCart()" class="btn btn-outline-danger btn-sm">ClearCart</button>
    </div>
    <p class="text-main">TotalPrice:{{cartDetails.totalCartPrice | currency :"GBP"}}</p>
    @for (item of cartDetails.products; track item.product.id) {
    <div class="row mb-1 border">
        <div class="col-md-1">
            <img [src]="item.product.imageCover" class="w-100" [alt]="item.product.title"/>
        </div>
        <div class="col-md-11 d-flex justify-content-between align-items-center ">
            <div>
                <h3 class="h5">{{item.product.title}}</h3>
                <p class="text-main">{{item.price | currency :"GBP"}} </p>
                <button (click)="RemoveItem(item.product.id)" class="text-danger btn cr">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
            <div>
                <span (click)="UpdatedCount(item.product.id,item.count + 1)"  class="text-main"><i class="fa-solid fa-circle-plus fa-2xl"></i></span>
                <span>{{item.count}}</span>
                <span (click)="UpdatedCount(item.product.id,item.count - 1)" class="text-main"><i class="fa-solid fa-circle-minus fa-2xl"></i></span>
            </div>
        </div>
    </div>
    }
</section>
