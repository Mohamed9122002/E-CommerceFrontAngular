
<section>
    <h2 class="text-center mb-4">Our Products</h2>
    <div class="my-4">
        <div class="row  g-3 ">
            @for (product of productList | pipesSearch:text; track product.id) {
            <div class="col-md-2">
                <div class="product p-2">
                    <div [routerLink]="['/details',product.id]">
                        <img class="w-100" [src]="product.imageCover" [alt]="product.title">
                        <h3 class="small text-main">{{product.category.name}}</h3>
                        <h6>{{ product.title.slice(0, 20) }}{{ product.title.length > 20 ? '...' : '' }}</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <span>{{product.price | currency}} EGP</span>
                            <div>
                                <span>
                                    <div class="fas fa-star rating-color"></div>
                                </span>
                                <span class="text-muted">{{product.ratingsAverage}}</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <button class="btn-main" (click)="AddToCart(product.id)">AddToCart</button>
                        <i (click)="addToWishlist(product.id)" class="fas fa-heart fa-2x text-secondary"></i>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
